services:
  db:
    image: postgres:16-alpine
    container_name: wikids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wikids
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wikids"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wikids-web:local
    container_name: wikids-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Override whatever might come from .env so the container always talks
      # to the `db` service over the compose network.
      DATABASE_URL: postgres://postgres:postgres@db:5432/wikids
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set in .env (run: openssl rand -base64 32)}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      # Required when Auth.js runs behind a reverse proxy or in a container
      # whose internal hostname differs from AUTH_URL.
      AUTH_TRUST_HOST: "true"
      # Server-only AI provider config (P3.3): passed through from .env only
      # when set; the provider fails closed (CONFIG) when any required piece
      # is missing — no other credential is ever reused.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-}"
      DEEPSEEK_TIMEOUT_MS: "${DEEPSEEK_TIMEOUT_MS:-30000}"
      DEEPSEEK_MAX_OUTPUT_TOKENS: "${DEEPSEEK_MAX_OUTPUT_TOKENS:-1024}"
      GAME_SEAT_HMAC_SECRET: "${GAME_SEAT_HMAC_SECRET:-}"
      NODE_ENV: production
    ports:
      - "8880:3000"

